<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · CRMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-card card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-car-front-fill auth-logo"></i>
        <h1 class="h4 fw-bold mb-1">CRMS Admin</h1>
        <p class="text-secondary mb-0">Sign in to the management panel</p>
      </div>

      {% if error %}
        <div class="alert alert-danger d-flex align-items-center" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <div>{{ error }}</div>
        </div>
      {% endif %}

      {% if config.DEBUG or config.TESTING %}
        <div class="alert alert-info small" role="alert">
          <div class="fw-semibold mb-1">
            <i class="bi bi-info-circle me-1"></i>Demo admin credentials
          </div>
          <div class="mb-1">Email: <code>admin@example.com</code></div>
          <div class="mb-0">Password: <code>Admin@123</code></div>
        </div>
      {% endif %}

      <form method="post" action="{{ url_for('admin_auth.login') }}" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input class="form-control" type="email" id="email" name="email"
                   value="{{ email or '' }}" required
                   autocomplete="username" autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input class="form-control" type="password" id="password" name="password"
                   required autocomplete="current-password">
          </div>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
        </button>
      </form>
    </div>
  </div>
</body>
</html>
