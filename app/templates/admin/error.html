<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · CRMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-card card shadow-sm">
    <div class="card-body p-4 p-md-5 text-center">
      <div class="error-code display-3 fw-bold text-secondary mb-2">{{ code }}</div>
      <i class="bi {{ 'bi-shield-exclamation' if code == 403 else 'bi-question-circle' }} text-warning fs-1 d-block mb-3"></i>
      <h1 class="h4 fw-bold mb-2">{{ 'Access Denied' if code == 403 else 'Page Not Found' }}</h1>
      <p class="text-secondary mb-4">{{ message }}</p>
      <div class="d-flex justify-content-center gap-2">
        <a class="btn btn-primary" href="{{ url_for('admin_dashboard.dashboard') }}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a class="btn btn-outline-secondary" href="{{ url_for('admin_auth.login') }}">Admin Login</a>
      </div>
    </div>
  </div>
</body>
</html>
